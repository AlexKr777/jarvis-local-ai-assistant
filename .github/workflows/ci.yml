name: CI

on:
  push:
    branches: [main, portfolio-polish]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # These three integration/benchmark files require intentionally ignored local
      # speech fixtures or the Windows project-local Python environment.
      - run: find test -name '*.test.js' ! -name 'speech-benchmark.test.js' ! -name 'transcription-service.test.js' ! -name 'parser-worker-integration.test.js' -print0 | xargs -0 node --test
